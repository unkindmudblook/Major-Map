        item.addEventListener('click', toggleAllCategories);

        const customColor = settings.colors[catKey] || '#8C9AA7';

        item.innerHTML = `
          <div class="cat-item-header">
            <input type="text" class="cat-name-input" value="${catName}">
            <div class="cat-badge-area" id="cat_badge_area_${catKey}" style="color: ${customColor};" onclick="makeCategoryEditable('${catKey}', this, ${catGoal})">
              <span id="earned-badge-${catKey}">0</span> / <span id="goal-badge-${catKey}">${catGoal}</span> cr
            </div>
          </div>
          <div class="progress-track"><div class="progress-fill" id="bar-${catKey}" style="background: ${customColor};"></div></div>
          <div class="cat-dropdown-body" id="cat_dropdown_${catKey}">
            <div id="cat_list_${catKey}" style="margin-bottom: 6px;"></div>
            <button class="btn-add" type="button" onclick="addCustomCatItem('${catKey}', event)">+ Add Required Course</button>
            
            <div class="cat-completed-accordion ${isCompCollapsed ? 'collapsed' : ''}" id="cat_completed_accordion_${catKey}" style="display: none;">
              <div class="cat-completed-accordion-header" onclick="toggleCatCompletedAccordion('${catKey}', event)">
                <span><span id="cat_completed_icon_${catKey}">${isCompCollapsed ? '►' : '▼'}</span> Completed</span>
                <span id="cat_completed_count_${catKey}" style="font-weight:700;">0 cr</span>
              </div>
              <div class="cat-completed-accordion-body" id="cat_completed_list_${catKey}"></div>
            </div>
          </div>
        `;

        item.querySelector('.cat-name-input').addEventListener('input', (e) => {
          settings.catNames[catKey] = e.target.value;
          if (catKey === 'minor1') { settings.minor1Name = e.target.value; const el = document.getElementById('minor1NameInput'); if (el) el.value = e.target.value; }
          if (catKey === 'minor2') { settings.minor2Name = e.target.value; const el = document.getElementById('minor2NameInput'); if (el) el.value = e.target.value; }
          if (catKey === 'cert') { settings.certName = e.target.value; const el = document.getElementById('certNameInput'); if (el) el.value = e.target.value; }
          persistSettings();
          updateCategoryDropdowns();
          updateAllCourseSelectors();
        });
        container.appendChild(item);
      });
      renderCategoryItems();
    }

    function addCustomCatItem(catKey, event) {
      if (event) event.stopPropagation();
      if (!catItemsStore[catKey]) catItemsStore[catKey] = [];
      catItemsStore[catKey].push({ name: '', credits: 3, terms: ['Fall', 'Spring'] });
      persistCatItems();
      renderCategoryItems();
      updateAllCourseSelectors();
      globalCatsExpanded = true;
      localStorage.setItem(CATS_EXPANDED_KEY, JSON.stringify(globalCatsExpanded));
      document.querySelectorAll('.cat-item').forEach(el => el.classList.add('expanded'));
    }

    function getCompletedCoursesForCategory(catKey) {
      const completedList = [];
      document.querySelectorAll('.course-row').forEach(row => {
        const chk = row.querySelector('.course-chk');
        if (!chk || !chk.checked) return;
        
        const catSel = row.querySelector('.select-cat');
        if (!catSel || catSel.value !== catKey) return;

        const nameControl = row.querySelector('.course-name-select, .course-name-input');
        const nameVal = getCourseControlName(nameControl);
        const creditsInput = row.querySelector('.course-credits');
        const creds = Number.parseFloat(creditsInput?.value) || 0;

        if (nameVal) {
          completedList.push({ name: nameVal, credits: creds });
        }
      });
      return completedList;
    }

    function renderCategoryItems() {
      const keys = getActiveCategoryKeys();
      keys.forEach(catKey => {
        const listContainer = document.getElementById(`cat_list_${catKey}`);
        const completedAccordion = document.getElementById(`cat_completed_accordion_${catKey}`);
        const completedListContainer = document.getElementById(`cat_completed_list_${catKey}`);
        const completedCountSpan = document.getElementById(`cat_completed_count_${catKey}`);
        
        if (!listContainer) return;
        listContainer.innerHTML = '';
        if (completedListContainer) completedListContainer.innerHTML = '';

        const completedCourses = getCompletedCoursesForCategory(catKey);
        const completedNamesSet = new Set(completedCourses.map(c => c.name.trim().toLowerCase()));

        const items = (catItemsStore[catKey] || []).filter(item => {
          if (!item.name) return true;
          return !completedNamesSet.has(item.name.trim().toLowerCase());
        });

        if (items.length === 0 && completedCourses.length === 0) {
          listContainer.innerHTML = `<div style="font-size:10px; color:#94a3b8; text-align:center; padding:4px;">No courses listed yet</div>`;
        } else if (items.length === 0) {
          listContainer.innerHTML = `<div style="font-size:10px; color:#10b981; text-align:center; padding:4px; font-weight:600;">All required courses completed!</div>`;
        }

        items.forEach((item) => {
          const originalIndex = catItemsStore[catKey].indexOf(item);
          const row = document.createElement('div');
          row.className = 'cat-course-row';
          
          const topSubRow = document.createElement('div');
          topSubRow.className = 'cat-course-top-line';

          const nameInput = document.createElement('input');
          nameInput.type = 'text';
          nameInput.className = 'cat-course-name';
          nameInput.placeholder = 'Course Name';
          nameInput.value = item.name;
          nameInput.addEventListener('click', (e) => e.stopPropagation());
          nameInput.addEventListener('input', (e) => {
            e.stopPropagation();
            item.name = e.target.value;
            persistCatItems();
            updateAllCourseSelectors();
          });

          const creditsInput = document.createElement('input');
          creditsInput.type = 'number';
          creditsInput.min = '0';
          creditsInput.className = 'cat-course-credits';
          creditsInput.value = item.credits;
          creditsInput.addEventListener('click', (e) => e.stopPropagation());
          creditsInput.addEventListener('input', (e) => {
            e.stopPropagation();
            item.credits = Number.parseFloat(e.target.value) || 0;
            persistCatItems();
          });

          const detailsBtn = document.createElement('button');
          detailsBtn.className = 'btn-toggle-details';
          detailsBtn.type = 'button';
          detailsBtn.textContent = '⚙ Details';
          detailsBtn.title = 'Edit Prerequisites and Offered Terms';
          
          detailsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            detailsPanel.classList.toggle('open');
          });

          const delBtn = document.createElement('button');
          delBtn.className = 'btn-del';
          delBtn.type = 'button';
          delBtn.textContent = '✕';
          delBtn.title = 'Remove course';
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (originalIndex !== -1) catItemsStore[catKey].splice(originalIndex, 1);
            persistCatItems();
            renderCategoryItems();
            updateAllCourseSelectors();
            recalculate();
          });

          topSubRow.append(nameInput, creditsInput, detailsBtn, delBtn);

          const detailsPanel = document.createElement('div');
          detailsPanel.className = 'cat-course-details-panel';
          detailsPanel.addEventListener('click', (e) => e.stopPropagation());

          const prereqInput = document.createElement('input');
          prereqInput.type = 'text';
          prereqInput.className = 'cat-course-prereqs';
          prereqInput.placeholder = 'Prerequisites';
          prereqInput.value = Array.isArray(item.prereqs) ? item.prereqs.join(', ') : (item.prereqs || '');
          
          prereqInput.addEventListener('click', (e) => e.stopPropagation());
          prereqInput.addEventListener('input', (e) => {
            e.stopPropagation();
            item.prereqs = e.target.value;
            persistCatItems();
            refreshAllCourseValidations();
          });

          const termsContainer = document.createElement('div');
          termsContainer.className = 'cat-terms-container';
          termsContainer.addEventListener('click', (e) => e.stopPropagation());

          if (!Array.isArray(item.terms)) {
            item.terms = ['Fall', 'Spring'];
          }

          ['Fall', 'Spring', 'Summer'].forEach(term => {
            const labelEl = document.createElement('label');
            labelEl.className = 'cat-term-checkbox-label';
            labelEl.addEventListener('click', (e) => e.stopPropagation());
            
            const chk = document.createElement('input');
            chk.type = 'checkbox';
            chk.checked = item.terms.includes(term);
            chk.addEventListener('click', (e) => e.stopPropagation());
            chk.addEventListener('change', (e) => {
              e.stopPropagation();
              if (chk.checked) {
                if (!item.terms.includes(term)) item.terms.push(term);
              } else {
                item.terms = item.terms.filter(t => t !== term);
              }
              persistCatItems();
              refreshAllCourseValidations();
            });

            labelEl.append(chk, document.createTextNode(term));
            termsContainer.appendChild(labelEl);
          });

          detailsPanel.append(prereqInput, termsContainer);
          row.append(topSubRow, detailsPanel);
          listContainer.appendChild(row);
        });

        if (completedCourses.length > 0) {
          if (completedAccordion) completedAccordion.style.display = 'block';
          let catCompCredsTotal = 0;

          completedCourses.forEach(comp => {
            catCompCredsTotal += comp.credits;
            const row = document.createElement('div');
            row.className = 'cat-course-row completed-cat-row';
            row.style.marginBottom = '4px';

            const topSubRow = document.createElement('div');
            topSubRow.className = 'cat-course-top-line';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'cat-course-name';
            nameSpan.style.border = 'none';
            nameSpan.style.background = 'transparent';
            nameSpan.style.color = '#334155';
            nameSpan.textContent = `✓ ${comp.name}`;

            const credSpan = document.createElement('span');
            credSpan.className = 'cat-course-credits';
            credSpan.style.border = 'none';
            credSpan.style.background = 'transparent';
            credSpan.style.color = '#64748b';
            credSpan.textContent = `${comp.credits} cr`;

            topSubRow.append(nameSpan, credSpan);
            row.appendChild(topSubRow);
            if (completedListContainer) completedListContainer.appendChild(row);
          });

          if (completedCountSpan) completedCountSpan.textContent = `${catCompCredsTotal} cr`;
        } else {
          if (completedAccordion) completedAccordion.style.display = 'none';
        }
      });
    }

    function updateCategoryDropdowns() {
      document.querySelectorAll('.select-cat').forEach(select => {
        const currentVal = select.value;
        populateCategoryOptions(select, currentVal);
        autoSizeSelect(select);
      });
    }

    function populateCategoryOptions(select, selectedValue) {
      select.innerHTML = '';
      const keys = getActiveCategoryKeys();
      keys.push('none');

      keys.forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;

        let fullLabel = key === 'none' ? 'Other' : (settings.catNames[key] || key);
        let displayLabel = fullLabel;

        if (key === 'elec' && fullLabel === 'Directed Electives') {
          displayLabel = 'Electives';
        }

        opt.textContent = (selectedValue === key) ? displayLabel : fullLabel;
        opt.selected = selectedValue === key;
        select.appendChild(opt);
      });
    }

    function updateAllCourseSelectors() {
      document.querySelectorAll('.course-name-select').forEach(sel => {
        const currentVal = getCourseControlName(sel);
        const row = sel.closest('.course-row');
        const cat = row?.querySelector('.select-cat');
        populateCourseSelectorOptions(sel, currentVal, cat ? cat.value : 'none');
      });
    }

    function populateCourseSelectorOptions(selectEl, selectedName, defaultCatKey) {
      if (!selectEl) return;
      selectEl.innerHTML = '';
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Select';
      placeholder.disabled = false;
      placeholder.selected = !selectedName;
      selectEl.appendChild(placeholder);

      let foundSelected = false;
      const keys = getActiveCategoryKeys();

      keys.forEach(catKey => {
        const items = catItemsStore[catKey] || [];
        if (!items.length) return;
        const group = document.createElement('optgroup');
        group.label = settings.catNames[catKey] || catKey;
        items.forEach(item => {
          if (!item.name) return;
          const opt = document.createElement('option');
          opt.value = JSON.stringify({ name: item.name, credits: item.credits, category: catKey });
          opt.textContent = item.name;
          if (String(item.name).trim().toLowerCase() === String(selectedName || '').trim().toLowerCase()) {
            opt.selected = true;
            foundSelected = true;
          }
          group.appendChild(opt);
        });
        selectEl.appendChild(group);
      });

      const customOpt = document.createElement('option');
      customOpt.value = '__custom__';
      customOpt.textContent = 'Type Custom';
      selectEl.appendChild(customOpt);

      if (!foundSelected && selectedName) {
        const customOptSelected = document.createElement('option');
        customOptSelected.value = JSON.stringify({ name: selectedName, credits: 3, category: defaultCatKey });
        customOptSelected.textContent = selectedName;
        customOptSelected.selected = true;
        selectEl.insertBefore(customOptSelected, customOpt);
      }
    }

    function toggleYear(yearId) {
      collapsedState[yearId] = !collapsedState[yearId];
      localStorage.setItem(COLLAPSED_KEY, JSON.stringify(collapsedState));
      const yearBlock = document.getElementById(`block_${yearId}`);
      if (!yearBlock) return;
      const icon = yearBlock.querySelector('.toggle-icon');
      yearBlock.classList.toggle('collapsed', !!collapsedState[yearId]);
      if (icon) icon.innerText = collapsedState[yearId] ? '►' : '▼';
    }

    function saveToStorage() {
      store = (store && typeof store === 'object') ? store : {};
      store.initialized = true;

      document.querySelectorAll('.course-list[id^="list_"]').forEach(list => {
        const semKey = list.id.slice('list_'.length);
        const courses = [];
        list.querySelectorAll('.course-row').forEach(row => {
          const chk = row.querySelector('.course-chk');
          const nameInput = row.querySelector('.course-name-select, .course-name-input');
          const credits = row.querySelector('.course-credits');
          const degree = row.querySelector('.select-degree');
          const category = row.querySelector('.select-cat');
          if (!chk || !nameInput || !credits || !degree || !category) return;
          
          let nameVal = nameInput.value;
          if (nameInput.tagName === 'SELECT' && nameVal && nameVal !== '__custom__') {
            try { nameVal = JSON.parse(nameVal).name; } catch (e) {}
          } else if (nameInput.tagName === 'SELECT' && nameVal === '__custom__') {
            nameVal = '';
          }

          courses.push({
            name: nameVal,
            credits: Number.parseFloat(credits.value) || 0,
            done: chk.checked,
            degree: degree.value,
            category: category.value
          });
        });
        store[semKey] = courses;
      });

      persistStore();
    }

    function toggleSummer(yearId, event) {
      if (event) event.stopPropagation();
      saveToStorage();
      summerState[yearId] = !summerState[yearId];
      localStorage.setItem(SUMMER_KEY, JSON.stringify(summerState));
      renderPlan();
      recalculate();
    }

    function renderPlan() {
      const container = document.getElementById('planContainer');
      if (!container) return;
      container.innerHTML = '';

      defaultBlocks.forEach(y => {
        const isCollapsed = !!collapsedState[y.id];
        const hasSummer = !!summerState[y.id];
        const activeSems = [...y.baseSems];
        if (y.allowSummerToggle && hasSummer) activeSems.push('Summer');

        const yearBlock = document.createElement('div');
        yearBlock.id = `block_${y.id}`;
        yearBlock.className = `year-block ${y.yearClass} ${isCollapsed ? 'collapsed' : ''}`;

        const header = document.createElement('div');
        header.className = 'year-header';
        header.addEventListener('click', () => toggleYear(y.id));
        header.innerHTML = `
          <div class="year-header-left">
            <span class="toggle-icon">${isCollapsed ? '►' : '▼'}</span>
            <span>${y.name}</span>
          </div>
          <span class="year-summary-badge" id="badge_year_${y.id}">0 cr contributed</span>
        `;
        yearBlock.appendChild(header);

        const yearBody = document.createElement('div');
        yearBody.className = 'year-body';
        const semGrid = document.createElement('div');
        semGrid.className = 'semesters-grid';

        activeSems.forEach(semName => {
          const semKey = `${y.id}_${semName}`;
          let semStyle = 'sem-hs';
          if (semName === 'Fall') semStyle = 'sem-fall';
          if (semName === 'Spring') semStyle = 'sem-spring';
          if (semName === 'Summer') semStyle = 'sem-summer';

          const semBox = document.createElement('div');
          semBox.className = `sem-box ${semStyle}`;
          const title = document.createElement('div');
          title.className = 'sem-title';
          const label = document.createElement('span');
          label.className = 'sem-label';
          label.textContent = semName;

          const titleRight = document.createElement('div');
          titleRight.className = 'sem-title-right';

          const total = document.createElement('span');
          total.id = `tot_${semKey}`;
          total.style.cssText = 'font-size:10px; color:#64748b;';
          total.textContent = '0 / 0 cr';

          const flag = document.createElement('span');
          flag.id = `flag_${semKey}`;
          flag.className = 'underload-tag';
          flag.style.display = 'none';
          flag.textContent = '< 12 cr';

          titleRight.append(flag, total);
          title.append(label, titleRight);

          const list = document.createElement('div');
          list.className = 'course-list';
          list.id = `list_${semKey}`;
          const addButton = document.createElement('button');
          addButton.className = 'btn-add';
          addButton.textContent = '+ Add Course';
          addButton.addEventListener('click', () => addCourse(semKey, '', 3, false, y.defaultDegree, y.defaultCat));
          semBox.append(title, list, addButton);
          semGrid.appendChild(semBox);
        });

        if (y.allowSummerToggle) {
          const btnSlot = document.createElement('div');
          btnSlot.className = 'summer-btn-slot';
          const button = document.createElement('button');
          button.className = `btn-summer-plus ${hasSummer ? 'active-x' : ''}`;
          button.title = hasSummer ? 'Remove Summer Semester' : 'Add Summer Semester';
          button.textContent = hasSummer ? '✕' : '+';
          button.addEventListener('click', event => toggleSummer(y.id, event));
          btnSlot.appendChild(button);
          semGrid.appendChild(btnSlot);
        }

        yearBody.appendChild(semGrid);
        yearBlock.appendChild(yearBody);
        container.appendChild(yearBlock);

        activeSems.forEach(semName => {
          const semKey = `${y.id}_${semName}`;
          const savedCourses = store[semKey];
          if (Array.isArray(savedCourses)) {
            savedCourses.forEach(course => addCourse(
              semKey,
              course.name ?? '',
              course.credits ?? 3,
              !!course.done,
              course.degree || y.defaultDegree,
              course.category || y.defaultCat,
              false
            ));
          } else if (semName !== 'Summer') {
            addCourse(semKey, '', 3, false, y.defaultDegree, y.defaultCat, false);
          }
          initDragContainer(semKey);
        });
      });

      store.initialized = true;
      persistStore();
    }

    function initDragContainer(semKey) {
      const list = document.getElementById(`list_${semKey}`);
      if (!list) return;
      list.addEventListener('dragover', event => {
        event.preventDefault();
        const dragging = document.querySelector('.course-row.dragging');
        if (!dragging) return;
        const afterElement = getDragAfterElement(list, event.clientY);
        if (afterElement == null) list.appendChild(dragging);
        else list.insertBefore(dragging, afterElement);
      });
    }

    function getDragAfterElement(container, y) {
      const elements = [...container.querySelectorAll('.course-row:not(.dragging)')];
      return elements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        return offset < 0 && offset > closest.offset
          ? { offset, element: child }
          : closest;
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function getCourseControlName(control) {
      if (!control) return '';
      if (control.tagName !== 'SELECT') return control.value;
      if (control.value === '__custom__') return '';
      try { return JSON.parse(control.value).name || ''; } catch (e) { return ''; }
    }

    function addCourse(semKey, name = '', credits = 3, done = false, degree = 'bach', category = 'none', shouldRecalculate = true) {
      const list = document.getElementById(`list_${semKey}`);
      if (!list) return;
      const row = document.createElement('div');
      row.className = 'course-row';
      row.draggable = true;

      const dragHandle = document.createElement('span');
      dragHandle.className = 'drag-handle';
      dragHandle.title = 'Drag to reorder';
      dragHandle.textContent = '⋮⋮';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'course-chk';
      checkbox.checked = !!done;
      checkbox.addEventListener('change', () => {
        recalculate();
      });

      const isCustomInitial = (name && name !== '__custom__' && !isExistingCategoryItem(name));
      let nameControl;
      if (isCustomInitial) {
        nameControl = document.createElement('input');
        nameControl.type = 'text';
        nameControl.className = 'course-name-input';
        nameControl.placeholder = 'Type custom class name...';
        nameControl.value = name;
        nameControl.addEventListener('input', () => { recalculate(); });
      } else {
        nameControl = document.createElement('select');
        nameControl.className = 'course-name-select';
        populateCourseSelectorOptions(nameControl, name, category);
      }

      const courseCredits = document.createElement('input');
      courseCredits.type = 'number';
      courseCredits.min = '0';
      courseCredits.className = 'course-credits';
      courseCredits.value = credits;
      courseCredits.addEventListener('input', recalculate);

      const degreeSelect = document.createElement('select');
      degreeSelect.className = 'select-degree';
      [['bach', 'Bach'], ['mast', 'Mast']].forEach(([value, label]) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = label;
        option.selected = degree === value;
        degreeSelect.appendChild(option);
      });
      degreeSelect.addEventListener('change', () => {
        autoSizeSelect(degreeSelect);
        recalculate();
      });

      const categorySelect = document.createElement('select');
      categorySelect.className = 'select-cat';
      populateCategoryOptions(categorySelect, category);
      
      categorySelect.addEventListener('change', () => {
        populateCategoryOptions(categorySelect, categorySelect.value);
        autoSizeSelect(categorySelect);
        if (nameControl.classList.contains('course-name-select')) {
          const selectedName = getCourseControlName(nameControl);
          populateCourseSelectorOptions(nameControl, selectedName, categorySelect.value);
        }
        recalculate();
      });

      function handleCourseSelection() {
        if (nameControl.value === '__custom__') {
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'course-name-input';
          input.placeholder = 'Type custom class name...';
          input.value = '';
          input.addEventListener('input', () => { recalculate(); });
          nameControl.replaceWith(input);
          nameControl = input;
          input.focus();
        } else if (nameControl.value) {
          try {
            const selected = JSON.parse(nameControl.value);
            courseCredits.value = selected.credits;
            categorySelect.value = selected.category;
            populateCategoryOptions(categorySelect, selected.category);
            autoSizeSelect(categorySelect);
          } catch (e) {}
        }
        recalculate();
      }
      if (nameControl.tagName === 'SELECT') nameControl.addEventListener('change', handleCourseSelection);

      const warningEl = document.createElement('div');
      warningEl.className = 'course-warning';
      warningEl.style.display = 'none';

      const deleteButton = document.createElement('button');
      deleteButton.className = 'btn-del';
      deleteButton.type = 'button';
      deleteButton.textContent = '✕';
      deleteButton.title = 'Remove course';
      deleteButton.addEventListener('click', () => removeCourse(deleteButton));

      row.append(dragHandle, checkbox, nameControl, courseCredits, degreeSelect, categorySelect, deleteButton, warningEl);
      row.addEventListener('dragstart', () => row.classList.add('dragging'));
      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        recalculate();
      });
      list.appendChild(row);
      autoSizeSelect(degreeSelect);
      autoSizeSelect(categorySelect);

      if (shouldRecalculate) recalculate();
    }

    function isExistingCategoryItem(name) {
      const keys = getActiveCategoryKeys();
      for (let catKey of keys) {
        const items = catItemsStore[catKey] || [];
        if (items.some(item => item.name === name)) return true;
      }
      return false;
    }

    function findRequiredCourse(name) {
      const target = String(name || '').trim().toLowerCase();
      if (!target) return null;
      const keys = getActiveCategoryKeys();
      for (const catKey of keys) {
        const found = (catItemsStore[catKey] || []).find(item =>
          String(item.name || '').trim().toLowerCase() === target
        );
        if (found) return found;
      }
      return null;
    }

    function getSemesterOrder(row) {
      const list = row && row.closest('.course-list');
      const id = list ? list.id.replace(/^list_/, '') : '';
      if (id === 'hs_AP') return 0;
      const match = id.match(/^y([1-5])_(Fall|Spring|Summer)$/);
      if (!match) return Number.MAX_SAFE_INTEGER;
      const year = Number(match[1]);
      const semOrder = { Fall: 0, Spring: 1, Summer: 2 }[match[2]];
      return 1 + (year - 1) * 3 + semOrder;
    }

    function getSemesterNameFromRow(row) {
      const list = row && row.closest('.course-list');
      const id = list ? list.id.replace(/^list_/, '') : '';
      if (id === 'hs_AP') return 'AP';
      const match = id.match(/^y([1-5])_(Fall|Spring|Summer)$/);
      return match ? match[2] : '';
    }

    function refreshAllCourseValidations() {
      const courseNameCount = {};

      document.querySelectorAll('.course-row').forEach(row => {
        const control = row.querySelector('.course-name-select, .course-name-input');
        const nameVal = getCourseControlName(control).trim().toLowerCase();
        if (nameVal) {
          courseNameCount[nameVal] = (courseNameCount[nameVal] || 0) + 1;
        }
      });

      document.querySelectorAll('.course-row').forEach(row => {
        const control = row.querySelector('.course-name-select, .course-name-input');
        const warning = row.querySelector('.course-warning');
        if (!control || !warning) return;

        const nameVal = getCourseControlName(control).trim().toLowerCase();
        const currentSem = getSemesterNameFromRow(row);
        const req = findRequiredCourse(nameVal);

        const flags = [];

        if (nameVal && courseNameCount[nameVal] > 1) {
          flags.push('Class is placed on the plan twice');
        }

        if (req && Array.isArray(req.terms) && req.terms.length > 0 && currentSem !== 'AP') {
          if (!req.terms.includes(currentSem)) {
            const offeredStr = req.terms.join(', ').toLowerCase();
            flags.push(`Only offered in ${offeredStr}`);
          }
        }

        if (req && row) {
          const raw = Array.isArray(req.prereqs) ? req.prereqs.join(',') : String(req.prereqs || '');
          const prereqs = raw.split(/[,;\n]+/).map(v => v.trim()).filter(Boolean);
          const currentOrder = getSemesterOrder(row);
          const plannedEarlier = new Set();

          document.querySelectorAll('.course-row').forEach(otherRow => {
            if (otherRow === row) return;
            const otherCtrl = otherRow.querySelector('.course-name-select, .course-name-input');
            if (!otherCtrl || getSemesterOrder(otherRow) >= currentOrder) return;
            const val = getCourseControlName(otherCtrl).trim().toLowerCase();
            if (val) plannedEarlier.add(val);
          });

          const missing = prereqs.filter(p => !plannedEarlier.has(p.toLowerCase()));
          if (missing.length > 0) {
            flags.push(`Prerequisite(s) not met: ${missing.join(', ')}`);
          }
        }

        if (flags.length > 0) {
          warning.textContent = flags.join(' | ');
          warning.style.display = 'block';
        } else {
          warning.textContent = '';
          warning.style.display = 'none';
        }
      });
    }

    function removeCourse(button) {
      const row = button.closest('.course-row');
      if (row) row.remove();
      recalculate();
    }

    function setRingOffset(ringId, percent, isSmall = false) {
      const ring = document.getElementById(ringId);
      if (!ring) return;
      const circ = isSmall ? SMALL_CIRCUMFERENCE : CIRCUMFERENCE;
      const capped = Math.min(100, Math.max(0, percent));
      ring.style.strokeDasharray = circ;
      ring.style.strokeDashoffset = circ - (capped / 100) * circ;
    }

    function recalculate() {
      saveToStorage();
      let bachEarned = 0;
      let mastEarned = 0;
      let minor1Earned = 0;
      let minor2Earned = 0;
      let certEarned = 0;

      const catEarned = { core: 0, major: 0, elec: 0, gccr: 0, minor1: 0, minor2: 0, cert: 0, mast: 0 };

      defaultBlocks.forEach(y => {
        let yearBachEarned = 0;
        let yearMastEarned = 0;
        const activeSems = [...y.baseSems];
        if (y.allowSummerToggle && summerState[y.id]) activeSems.push('Summer');

        activeSems.forEach(semName => {
          const semKey = `${y.id}_${semName}`;
          const courses = store[semKey] || [];
          let semEarned = 0;
          let semPlanned = 0;

          courses.forEach(course => {
            semPlanned += course.credits;

            if (course.done) {
              semEarned += course.credits;
              if (course.degree === 'mast') {
                mastEarned += course.credits;
                yearMastEarned += course.credits;
              } else {
                bachEarned += course.credits;
                yearBachEarned += course.credits;
              }

              if (Object.prototype.hasOwnProperty.call(catEarned, course.category)) {
                catEarned[course.category] += course.credits;
              }
              if (course.category === 'minor1') minor1Earned += course.credits;
              if (course.category === 'minor2') minor2Earned += course.credits;
              if (course.category === 'cert') certEarned += course.credits;
            }
          });

          const totalSpan = document.getElementById(`tot_${semKey}`);
          if (totalSpan) totalSpan.textContent = `${semEarned} / ${semPlanned} cr`;

          const flagEl = document.getElementById(`flag_${semKey}`);
          if (flagEl) {
            if (semKey !== 'hs_AP' && semPlanned < 12) {
              flagEl.style.display = 'inline-block';
            } else {
              flagEl.style.display = 'none';
            }
          }
        });

        const yearBadge = document.getElementById(`badge_year_${y.id}`);
        if (yearBadge) {
          if (yearBachEarned > 0 && yearMastEarned > 0 && settings.showMasters) yearBadge.textContent = `${yearBachEarned} Bach / ${yearMastEarned} Mast cr`;
          else if (yearMastEarned > 0 && settings.showMasters) yearBadge.textContent = `${yearMastEarned} Mast cr contributed`;
          else yearBadge.textContent = `${yearBachEarned} cr contributed`;
        }
      });

      // Bachelor's Calculation
      const bachGoal = settings.bachGoal || 128;
      const bachPercent = Math.min(100, Math.round((bachEarned / bachGoal) * 100));
      const bachRem = Math.max(0, bachGoal - bachEarned);
      document.getElementById('bachPercent').textContent = `${bachPercent}%`;
      if (document.getElementById('bachEarnedNum')) document.getElementById('bachEarnedNum').textContent = bachEarned;
      if (document.getElementById('bachGoalDisplay')) document.getElementById('bachGoalDisplay').textContent = bachGoal;
      document.getElementById('bachSub').textContent = `${bachRem} cr remaining`;
      setRingOffset('bachRing', bachPercent, false);

      // Minor 1 Calculation
      if (settings.showMinor1) {
        const minor1Goal = settings.minor1Goal || 18;
        const minor1Percent = Math.min(100, Math.round((minor1Earned / minor1Goal) * 100));
        document.getElementById('minor1Percent').textContent = `${minor1Percent}%`;
        if (document.getElementById('minor1EarnedNum')) document.getElementById('minor1EarnedNum').textContent = minor1Earned;
        if (document.getElementById('minor1GoalDisplay')) document.getElementById('minor1GoalDisplay').textContent = minor1Goal;
        setRingOffset('minor1Ring', minor1Percent, true);
      }

      // Minor 2 Calculation
      if (settings.showMinor2) {
        const minor2Goal = settings.minor2Goal || 18;
        const minor2Percent = Math.min(100, Math.round((minor2Earned / minor2Goal) * 100));
        document.getElementById('minor2Percent').textContent = `${minor2Percent}%`;
        if (document.getElementById('minor2EarnedNum')) document.getElementById('minor2EarnedNum').textContent = minor2Earned;
        if (document.getElementById('minor2GoalDisplay')) document.getElementById('minor2GoalDisplay').textContent = minor2Goal;
        setRingOffset('minor2Ring', minor2Percent, true);
      }

      // Certificate Calculation
      if (settings.showCert) {
        const certGoal = settings.certGoal || 12;
        const certPercent = Math.min(100, Math.round((certEarned / certGoal) * 100));
        document.getElementById('certPercent').textContent = `${certPercent}%`;
        if (document.getElementById('certEarnedNum')) document.getElementById('certEarnedNum').textContent = certEarned;
        if (document.getElementById('certGoalDisplay')) document.getElementById('certGoalDisplay').textContent = certGoal;
        setRingOffset('certRing', certPercent, false);
      }

      // Master's Calculation
      if (settings.showMasters) {
        const mastGoal = settings.mastGoal || 30;
        const mastPercent = Math.min(100, Math.round((mastEarned / mastGoal) * 100));
        const mastRem = Math.max(0, mastGoal - mastEarned);
        document.getElementById('mastPercent').textContent = `${mastPercent}%`;
        if (document.getElementById('mastEarnedNum')) document.getElementById('mastEarnedNum').textContent = mastEarned;
        if (document.getElementById('mastGoalDisplay')) document.getElementById('mastGoalDisplay').textContent = mastGoal;
        document.getElementById('mastSub').textContent = `${mastRem} cr remaining`;
        setRingOffset('mastRing', mastPercent, false);
      }

      // Requirement Progress Bars
      const activeKeys = getActiveCategoryKeys();
      activeKeys.forEach(catKey => {
        const earned = catEarned[catKey] || 0;
        const goal = settings.catGoals[catKey] || 0;
        const pct = goal > 0 ? Math.min(100, Math.round((earned / goal) * 100)) : 0;
        
        const badgeEl = document.getElementById(`earned-badge-${catKey}`);
        const goalEl = document.getElementById(`goal-badge-${catKey}`);
        const barEl = document.getElementById(`bar-${catKey}`);
        if (badgeEl) badgeEl.textContent = earned;
        if (goalEl) goalEl.textContent = goal;
        if (barEl) barEl.style.width = `${pct}%`;
      });

      renderCategoryItems();
      refreshAllCourseValidations();
    }
  </script>
